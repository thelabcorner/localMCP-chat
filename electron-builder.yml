appId: dev.localmcp.chat
productName: localMCP-chat
copyright: MIT licensed

directories:
  output: release
  buildResources: build

# Only built output + runtime dependencies ship. Native prebuilds are narrowed again in each
# platform section so a package never carries another OS/CPU's executable payload.
files:
  - out/**
  - package.json
  # node-pty prefers build/Release over prebuilds. npm may leave a host-native build there,
  # which would silently override the target prebuild in a cross-arch package.
  - '!node_modules/node-pty/build/**/*'
  - '!node_modules/node-pty/third_party/**/*'
  - '!node_modules/node-pty/prebuilds/**/*'

# Common real-filesystem resources. Platform-specific tunnel/rg/native notices are appended
# below because their filenames and executable formats differ by OS.
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
  # electron-builder prunes TypeScript declaration files from packaged node_modules. The scoped
  # typecheck tool is a runtime compiler and needs the complete standard-library declaration set.
  - from: node_modules/typescript-compiler/lib
    to: typescript-compiler-lib
    filter: ['lib*.d.ts']
  # Tray status icons. Generated by scripts/make-icon.mjs, which scripts/package.mjs runs
  # before the build; the tray degrades to the plain app icon if they are ever absent.
  - from: build/tray
    to: tray
    filter: ['**/*']
  # Keep the installed application self-deploying: an operator or execution agent can recover the
  # exact runbook/template/helper used for another Windows host from the installed resources.
  - from: deploy/windows
    to: deploy/windows
    filter: ['**/*']

npmRebuild: false

asarUnpack:
  - '**/node_modules/node-pty/**'
compression: maximum

# electron-builder 26 defaults to the legacy FUSE2 AppImage runtime. Ubuntu 24.04 renamed
# libfuse2 to libfuse2t64 and does not install it by default, so use builder's static runtime
# toolset instead. This keeps the standalone AppImage actually portable on the release target.
toolsets:
  appimage: "1.0.3"

win:
  target: nsis
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  files:
    - from: resources/packaging/native/win32/${arch}/node_modules
      to: node_modules
      filter: ['**/*']
  extraResources:
    - from: resources/packaging/tunnel/win32/${arch}
      to: tunnel
      filter: ['**/*']
    - from: resources/packaging/rg/win32/${arch}
      to: rg
      filter: ['**/*']

nsis:
  include: scripts/windows-installer-acl.nsh
  oneClick: false
  perMachine: false
  buildUniversalInstaller: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: localMCP-chat
  artifactName: localMCP-chat-Setup-${arch}.${ext}
  uninstallDisplayName: localMCP-chat
  deleteAppDataOnUninstall: false

linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Development
  executableName: localMCP-chat
  maintainer: localMCP-chat contributors
  syncDesktopName: true
  # electron-builder rewrites x64 to x86_64 for AppImage and amd64 for DEB when ${arch}
  # is used. Keep one stable public architecture label across formats/releases instead.
  artifactName: localMCP-chat-Linux-${env.LOCALMCP_PACKAGE_ARCH}.${ext}
  files:
    - from: resources/packaging/native/linux/${arch}/node_modules
      to: node_modules
      filter: ['**/*']
  extraResources:
    - from: build/runtime-icon.png
      to: runtime-icon.png
    - from: resources/packaging/tunnel/linux/${arch}
      to: tunnel
      filter: ['**/*']
    - from: resources/packaging/rg/linux/${arch}
      to: rg
      filter: ['**/*']

deb:
  depends:
    # Ubuntu 24.04 renamed GTK 3's runtime package for the time64 transition. Keep the old
    # package as an alternative so the same .deb remains installable on Ubuntu 22.04/Debian.
    - libgtk-3-0 | libgtk-3-0t64
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0 | libatspi2.0-0t64
    - libuuid1
    - libsecret-1-0
